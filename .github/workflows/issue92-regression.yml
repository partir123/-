name: Issue 92 regression

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/issue92-regression.yml"
  push:
    branches: ["fix/92-empty-summary", "main"]
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/issue92-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: issue92-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: Python 3.11 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      LANGSMITH_TRACING: "false"
      LANGCHAIN_TRACING_V2: "false"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install uv
        run: python -m pip install uv==0.12.24
      - name: Install locked project dependencies
        run: uv sync --locked --python 3.11
      - name: Verify regressions fail without the guard
        shell: bash
        run: |
          uv run --locked python - <<'PY'
          from pathlib import Path
          import unittest

          path = Path("src/ollama_deep_researcher/graph.py")
          original = path.read_bytes()
          guard = (
              '    if not running_summary.strip():\n'
              '        raise RuntimeError(\n'
              '            "SUMMARY_EMPTY: the model returned no summary text. "\n'
              '            "Check its context window and output settings."\n'
              '        )\n\n'
          )
          text = original.decode("utf-8").replace("\r\n", "\n")
          if text.count(guard) != 1:
              raise SystemExit("Expected exactly one summary guard; control not run.")
          try:
              path.write_text(text.replace(guard, "", 1), encoding="utf-8")
              suite = unittest.defaultTestLoader.discover("tests", pattern="test_summary_validation.py")
              result = unittest.TextTestRunner(verbosity=1, buffer=True).run(suite)
              if result.testsRun != 14 or result.errors or len(result.failures) != 42:
                  raise SystemExit("Unexpected negative-control outcome.")
              if any("RuntimeError not raised" not in text for _, text in result.failures):
                  raise SystemExit("Negative control failed for an unrelated reason.")
              print("Negative control OK: removing the guard causes 42 expected subtest failures.")
          finally:
              path.write_bytes(original)
          PY
      - name: Run regression tests with the guard restored
        run: uv run --locked python -m unittest discover -s tests -p test_summary_validation.py -v -b
      - name: Verify code and lockfile unchanged by tests
        run: git diff --exit-code -- src pyproject.toml uv.lock
